services:
  minio:
    # 공식 소스로 직접 빌드 (docker/minio/Dockerfile 참고). 최초 빌드는 수 분 걸린다.
    build:
      context: ./docker/minio
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
    image: productivity-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: productivity-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

# 버킷은 `uv run productivity init` (또는 첫 collect 실행 시) 자동 생성된다.

volumes:
  minio-data:
