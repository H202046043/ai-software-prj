services:
  minio:
    build:
      context: ./docker/minio
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
    image: productivity-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: productivity-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  minio-data:
